# Runs the unit/end-to-end test suite on every push to main and every pull
# request. Never delivers anything: no secrets are passed in, and keyring is
# forced to the null backend, so any accidental send fails for lack of
# credentials instead of emailing a Kindle.
name: Tests

on:
  push:
    branches: [main]   # not the bots' ntiy-state / daily-facts-state branches
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04   # pinned to match the delivery workflows
    timeout-minutes: 10
    env:
      PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install system packages
        # Graphviz's `dot` renders Mermaid flowcharts; DejaVu is the Linux
        # fallback for text-diagram images. The PDF renderer's glyph tests
        # need macOS-only fonts (Apple Color Emoji, Arial Unicode) and skip here.
        run: sudo apt-get update -q && sudo apt-get install -y -q graphviz fonts-dejavu-core

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests
